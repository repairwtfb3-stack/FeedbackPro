name: T7.1 R1 Pre-defense Build

on:
  push:
    branches:
      - main
    paths:
      - 'docs/t6/**'
      - 'research/t7/**'
      - '.github/workflows/t7-r1-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils graphviz fonts-liberation
          python -m pip install --upgrade pip
          python -m pip install python-docx pypdf

      - name: Build T7.1 R1 DOCX
        run: |
          python research/t7/build_r1.py
          test -s research/t7/build/WKR_Methodika_EG_T7_R1.docx
          grep -q 'STATUS: PASS' research/t7/build/T7_R1_TEXT_AUDIT.md

      - name: Convert to PDF and verify
        run: |
          mkdir -p research/t7/build/pdf
          libreoffice --headless --convert-to pdf --outdir research/t7/build/pdf research/t7/build/WKR_Methodika_EG_T7_R1.docx
          PDF=research/t7/build/pdf/WKR_Methodika_EG_T7_R1.pdf
          test -s "$PDF"
          pages=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          echo "$pages" | tee research/t7/build/PAGE_COUNT_R1.txt
          test "$pages" -ge 60
          test "$pages" -le 80
          pdftotext "$PDF" research/t7/build/WKR_Methodika_EG_T7_R1.txt
          grep -q 'СОДЕРЖАНИЕ' research/t7/build/WKR_Methodika_EG_T7_R1.txt
          grep -q 'Введение' research/t7/build/WKR_Methodika_EG_T7_R1.txt
          grep -q 'Глава 2' research/t7/build/WKR_Methodika_EG_T7_R1.txt
          grep -q 'Глава 3' research/t7/build/WKR_Methodika_EG_T7_R1.txt
          grep -q 'Заключение' research/t7/build/WKR_Methodika_EG_T7_R1.txt
          grep -q '1200' research/t7/build/WKR_Methodika_EG_T7_R1.txt
          grep -q '1192' research/t7/build/WKR_Methodika_EG_T7_R1.txt
          grep -q '99,33' research/t7/build/WKR_Methodika_EG_T7_R1.txt

      - name: Write build report
        run: |
          {
            echo '# T7.1 R1 build report'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Pages: $(cat research/t7/build/PAGE_COUNT_R1.txt)"
            echo 'Text normalization invariants: PASS'
            echo 'Citation markers and numeric token sequences for chapters 2–3 preserved by build-time assertions.'
            echo 'Final administrative title page remains outside the R1 gate until confirmed requisites are supplied.'
          } > research/t7/build/T7_R1_BUILD_REPORT.md

      - name: Upload T7.1 R1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: T7-1-R1-WKR-Methodika-EG
          path: |
            research/t7/build/WKR_Methodika_EG_T7_R1.docx
            research/t7/build/pdf/WKR_Methodika_EG_T7_R1.pdf
            research/t7/build/T7_R1_TEXT_AUDIT.md
            research/t7/build/T7_R1_BUILD_REPORT.md
            research/t7/build/PAGE_COUNT_R1.txt
            research/t7/build/normalized_text/T6_CHAPTER_2_R1.md
            research/t7/build/normalized_text/T6_CHAPTER_3_R1.md
          if-no-files-found: error
          retention-days: 30
