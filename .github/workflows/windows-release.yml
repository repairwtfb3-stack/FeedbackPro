name: FeedbackPro Windows Release Candidate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "feat/a4-r1-r2-windows-release"]

jobs:
  build-windows-rc:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      FEEDBACKPRO_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEEDBACKPRO_SOURCE_COMMIT }}
      - name: Verify source provenance
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:FEEDBACKPRO_SOURCE_COMMIT) {
            throw "Checkout provenance mismatch: expected $env:FEEDBACKPRO_SOURCE_COMMIT, got $actual"
          }
          Write-Host "A4-R2 SOURCE_COMMIT=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install -e ".[ui,release,dev]"
      - name: Regression tests
        shell: pwsh
        run: |
          pytest
          feedbackpro-gate-a2
          feedbackpro-gate-a3 --evidence A3_EVIDENCE.json
      - name: Build Windows RC
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Package contract smoke
        shell: pwsh
        run: ./packaging/windows/smoke.ps1 -ExpectedSourceCommit $env:FEEDBACKPRO_SOURCE_COMMIT
      - name: Upload Windows RC
        uses: actions/upload-artifact@v4
        with:
          name: FeedbackPro-windows-rc-${{ env.FEEDBACKPRO_SOURCE_COMMIT }}
          path: release/**
          if-no-files-found: error
          retention-days: 14
