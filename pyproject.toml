[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"

[project]
name="feedbackpro"
version="0.2.0"
description="Offline customer feedback analysis and control system"
readme="README.md"
requires-python=">=3.11"
dependencies=["openpyxl>=3.1,<4"]

[project.optional-dependencies]
ui=["PySide6>=6.7,<7"]
dev=["pytest>=8,<9"]

[project.scripts]
feedbackpro="feedbackpro.cli:main"
feedbackpro-ui="feedbackpro.ui:main"
feedbackpro-gate-a2="feedbackpro.gate_a2:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.setuptools.package-data]
feedbackpro=["Main.qml"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
